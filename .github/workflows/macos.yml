name: Build macOS
on:
  workflow_dispatch:
  push:
    branches: [smooth-texture-paint, terrain-origin]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: Build debug and release (universal)
        run: |
          scons platform=macos arch=universal target=template_debug api_version=4.5 -j4
          scons platform=macos arch=universal target=template_release api_version=4.5 -j4
      - uses: actions/upload-artifact@v4
        with:
          name: terrain3d-macos
          path: project/addons/terrain_3d/bin/*.framework
